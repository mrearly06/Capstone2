<?php

// Now safe to access session data
$userID = $_SESSION['userID'];

include "backend/connection.php";

// Fetch the user's details
$sql = "SELECT firstName, middleName, lastName, userImage FROM user WHERE userID = ?";
$stmt = $conn->prepare($sql);
$stmt->bind_param("i", $userID);
$stmt->execute();
$stmt->bind_result($firstName, $middleName, $lastName, $profile_image);
$stmt->fetch();
$stmt->close();
$conn->close();
?>
